<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐷 泡泡小猪洗澡</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(180deg, #e8f4f8 0%, #fce4ec 60%, #fff8e1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'PingFang SC', sans-serif;
            padding: 10px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #d4687c;
            letter-spacing: 0.05em;
        }
        canvas {
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(180,140,150,0.25);
            max-width: 100%;
            height: auto;
            cursor: none;
            touch-action: none;
            background: #fef9fb;
        }
        .hint {
            color: #b08a7a;
            font-size: 0.85rem;
            text-align: center;
            background: rgba(255,255,255,0.65);
            padding: 4px 16px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="title">🐷 给小猪洗澡 🫧</div>
    <canvas id="c" width="400" height="520"></canvas>
    <div class="hint">✨ 按住擦洗泥巴 · 洗完点小猪弹出爱心 ✨</div>
</div>
<script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const W = 400, H = 520;

    // ============ 游戏状态 ============
    let progress = 0;
    let gameState = 'playing';
    let doneTimer = 0;
    let sponge = { x: W/2, y: H/2, tx: W/2, ty: W/2, squish: 0 };
    let scrubbing = false;
    let onCanvas = false;
    let shake = 0;
    let mud = [];
    let bubbles = [];
    let sparkles = [];
    let hearts = [];

    // 泥巴斑点
    for (let i = 0; i < 14; i++) {
        mud.push({
            x: 130 + Math.random() * 140,
            y: 140 + Math.random() * 220,
            r: 8 + Math.random() * 16,
            cleaned: 0
        });
    }

    function dist(a, b, c, d) { return Math.hypot(a - c, b - d); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    // ============ 陶瓷小地砖 ============
    function drawTileFloor() {
        const tileSize = 60;
        const startX = (W - tileSize * 6) / 2;
        const startY = H - tileSize * 2 + 10;

        for (let row = 0; row < 2; row++) {
            for (let col = 0; col < 6; col++) {
                const x = startX + col * tileSize;
                const y = startY + row * tileSize;
                // 地砖底色
                const hue = 25 + (row + col) * 3;
                ctx.fillStyle = `hsl(${hue}, 30%, 88%)`;
                ctx.beginPath();
                ctx.roundRect(x + 2, y + 2, tileSize - 4, tileSize - 4, 8);
                ctx.fill();
                // 高光边
                ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(x + 2, y + 2, tileSize - 4, tileSize - 4, 8);
                ctx.stroke();
                // 阴影边
                ctx.strokeStyle = 'rgba(180,150,140,0.3)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.roundRect(x + 4, y + 4, tileSize - 8, tileSize - 8, 6);
                ctx.stroke();
                // 小圆点装饰
                ctx.fillStyle = 'rgba(200,170,160,0.25)';
                ctx.beginPath();
                ctx.arc(x + tileSize/2, y + tileSize/2, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        // 地面阴影
        const shadowGrad = ctx.createLinearGradient(0, startY - 10, 0, startY);
        shadowGrad.addColorStop(0, 'rgba(0,0,0,0)');
        shadowGrad.addColorStop(1, 'rgba(0,0,0,0.06)');
        ctx.fillStyle = shadowGrad;
        ctx.fillRect(startX, startY - 10, tileSize * 6, 10);
    }

    // ============ 绘制小猪（SVG + 手绘眼睛） ============
    function drawPiggy() {
        ctx.save();
        const sx = shake * (Math.random() - 0.5) * 2;
        const sy = shake * (Math.random() - 0.5) * 2;
        ctx.translate(sx, sy);

        const pigX = W/2 - 105, pigY = 135, pigW = 210, pigH = 250;

        // 身体（简化椭圆）
        const bodyGrad = ctx.createRadialGradient(W/2 - 5, pigY + 140, 20, W/2, pigY + 145, 90);
        bodyGrad.addColorStop(0, '#ffdbe2');
        bodyGrad.addColorStop(0.6, '#fcb5c2');
        bodyGrad.addColorStop(1, '#f090a5');
        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.ellipse(W/2, pigY + 155, 75, 65, 0, 0, Math.PI * 2);
        ctx.fill();

        // 头部
        const headGrad = ctx.createRadialGradient(W/2 - 3, pigY + 20, 10, W/2, pigY + 25, 55);
        headGrad.addColorStop(0, '#ffe8ed');
        headGrad.addColorStop(0.7, '#fcb5c2');
        headGrad.addColorStop(1, '#f090a5');
        ctx.fillStyle = headGrad;
        ctx.beginPath();
        ctx.arc(W/2, pigY + 30, 52, 0, Math.PI * 2);
        ctx.fill();

        // 身体高光
        const hl = ctx.createRadialGradient(W/2 - 15, pigY + 120, 8, W/2, pigY + 145, 65);
        hl.addColorStop(0, 'rgba(255,255,255,0.35)');
        hl.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = hl;
        ctx.beginPath();
        ctx.ellipse(W/2, pigY + 155, 70, 60, 0, 0, Math.PI * 2);
        ctx.fill();

        // 耳朵
        function ear(x, y, angle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            const eg = ctx.createLinearGradient(0, -18, 0, 12);
            eg.addColorStop(0, '#ffcdd8');
            eg.addColorStop(0.6, '#faa0b2');
            eg.addColorStop(1, '#e87a90');
            ctx.fillStyle = eg;
            ctx.beginPath();
            ctx.moveTo(-8, 6);
            ctx.quadraticCurveTo(-15, -14, -5, -22);
            ctx.quadraticCurveTo(7, -12, 10, 4);
            ctx.quadraticCurveTo(4, 9, -8, 6);
            ctx.fill();
            ctx.restore();
        }
        ear(W/2 - 30, pigY - 8, -0.25);
        ear(W/2 + 26, pigY - 10, 0.2);

        // 鼻子
        const snX = W/2 + 8, snY = pigY + 40;
        const snGrad = ctx.createRadialGradient(snX - 2, snY - 3, 3, snX, snY, 22);
        snGrad.addColorStop(0, '#ffced8');
        snGrad.addColorStop(1, '#f090a5');
        ctx.fillStyle = snGrad;
        ctx.beginPath();
        ctx.ellipse(snX, snY, 22, 16, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#a14b5a';
        ctx.beginPath(); ctx.arc(snX - 8, snY + 1, 4, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(snX + 8, snY + 1, 4, 0, Math.PI * 2); ctx.fill();

        // 腮红
        ctx.fillStyle = 'rgba(255,160,160,0.4)';
        ctx.beginPath(); ctx.arc(W/2 - 28, pigY + 32, 10, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(W/2 + 28, pigY + 30, 10, 0, Math.PI * 2); ctx.fill();

        // 腿
        function leg(x, y) {
            ctx.fillStyle = '#f7a8b8';
            ctx.beginPath(); ctx.roundRect(x - 10, y - 4, 20, 28, 10); ctx.fill();
            ctx.fillStyle = '#d18a98';
            ctx.beginPath(); ctx.roundRect(x - 8, y + 18, 16, 10, 5); ctx.fill();
        }
        leg(W/2 - 32, pigY + 210);
        leg(W/2 + 30, pigY + 208);
        leg(W/2 - 18, pigY + 215);
        leg(W/2 + 16, pigY + 214);

        // ===== 眼睛（手绘，保证能看到） =====
        function drawEye(x, y, star) {
            // 眼白
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2); ctx.fill();
            // 瞳孔
            ctx.fillStyle = '#2a1018';
            ctx.beginPath(); ctx.arc(x + 1, y, 6.5, 0, Math.PI * 2); ctx.fill();
            // 高光
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(x - 2, y - 4, 3, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 4, y + 2, 1.5, 0, Math.PI * 2); ctx.fill();
            if (star) {
                ctx.fillStyle = '#fff';
                ctx.font = '10px sans-serif';
                ctx.fillText('✨', x - 6, y - 8);
            }
        }
        const starEye = gameState === 'done' && doneTimer > 1.2;
        drawEye(W/2 - 16, pigY + 18, starEye);
        drawEye(W/2 + 18, pigY + 17, starEye);

        // 嘴巴
        ctx.strokeStyle = '#c45a6a';
        ctx.lineWidth = 2;
        ctx.beginPath();
        if (gameState === 'done') {
            ctx.arc(snX, snY + 10, 10, 0.2, Math.PI - 0.2);
        } else if (progress > 60) {
            ctx.arc(snX, snY + 10, 7, 0.3, Math.PI - 0.3);
        } else {
            ctx.arc(snX, snY + 18, 7, Math.PI + 0.3, -0.3);
        }
        ctx.stroke();

        // 尾巴
        ctx.strokeStyle = '#f7a8b8';
        ctx.lineWidth = 3.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(W/2 + 65, pigY + 120);
        ctx.quadraticCurveTo(W/2 + 88, pigY + 100, W/2 + 72, pigY + 82);
        ctx.quadraticCurveTo(W/2 + 58, pigY + 74, W/2 + 55, pigY + 90);
        ctx.stroke();

        ctx.restore();
    }

    function drawMud() {
        mud.forEach(s => {
            if (s.cleaned >= 1) return;
            const a = clamp(1 - s.cleaned, 0, 1);
            const g = ctx.createRadialGradient(s.x, s.y, s.r * 0.2, s.x, s.y, s.r);
            g.addColorStop(0, `rgba(90,55,35,${a * 0.9})`);
            g.addColorStop(0.6, `rgba(75,45,28,${a * 0.7})`);
            g.addColorStop(1, 'rgba(50,30,18,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    function drawSponge() {
        if (!onCanvas && !scrubbing) return;
        ctx.save();
        ctx.translate(sponge.x, sponge.y);
        const sq = sponge.squish;
        ctx.fillStyle = 'rgba(0,0,0,0.1)';
        ctx.beginPath(); ctx.roundRect(-16 + sq * 3, -10 + sq * 2, 32 - sq * 6, 22 + sq * 3, 7); ctx.fill();
        const g = ctx.createLinearGradient(0, -14, 0, 14 + sq);
        g.addColorStop(0, '#ffe680'); g.addColorStop(0.4, '#ffd54f'); g.addColorStop(1, '#f0a830');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.roundRect(-15 + sq * 3, -11 + sq, 30 - sq * 6, 20 + sq * 2, 6); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.beginPath(); ctx.roundRect(-10 + sq * 2, -7 + sq, 14 - sq * 4, 6, 3); ctx.fill();
        ctx.restore();
    }

    function drawProgress() {
        const bw = 240, bh = 12, bx = (W - bw) / 2, by = 16;
        ctx.fillStyle = 'rgba(0,0,0,0.06)'; ctx.beginPath(); ctx.roundRect(bx - 2, by - 2, bw + 4, bh + 4, 10); ctx.fill();
        ctx.fillStyle = '#f5e8e0'; ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 8); ctx.fill();
        const pw = (progress / 100) * bw;
        if (pw > 0) {
            const pg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
            pg.addColorStop(0, '#8dd4ec'); pg.addColorStop(0.5, '#5db8d8'); pg.addColorStop(1, '#a0ddf2');
            ctx.fillStyle = pg;
            ctx.beginPath(); ctx.roundRect(bx, by, pw, bh, 8); ctx.fill();
        }
        ctx.fillStyle = '#5a4030'; ctx.font = 'bold 10px "PingFang SC"'; ctx.textAlign = 'center';
        ctx.fillText('干净 ' + Math.round(progress) + '%', W / 2, by + 10);
    }

    function drawUI() {
        if (gameState !== 'done') return;
        const a = clamp(doneTimer / 1.5, 0, 0.5);
        ctx.fillStyle = `rgba(255,250,245,${a})`; ctx.fillRect(0, 0, W, H);
        if (doneTimer > 0.8) {
            const ta = clamp((doneTimer - 0.8) / 0.5, 0, 1);
            ctx.fillStyle = `rgba(210,100,120,${ta})`;
            ctx.font = 'bold 24px "PingFang SC"'; ctx.textAlign = 'center';
            ctx.fillText('✨ 香香小猪 ✨', W / 2, H / 2 - 25);
        }
        if (doneTimer > 1.5) {
            const ba = clamp((doneTimer - 1.5) / 0.4, 0, 1);
            const rbx = W / 2 - 55, rby = H / 2 + 8, rbw = 110, rbh = 36;
            ctx.fillStyle = `rgba(255,255,255,${ba * 0.9})`;
            ctx.strokeStyle = `rgba(220,140,150,${ba})`; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.roundRect(rbx, rby, rbw, rbh, 18); ctx.fill(); ctx.stroke();
            ctx.fillStyle = `rgba(200,90,110,${ba})`;
            ctx.font = 'bold 15px "PingFang SC"';
            ctx.fillText('🔄 再洗一次', W / 2, rby + 25);
        }
    }

    function spawnHeart(x, y) {
        hearts.push({ x, y, vx: (Math.random() - 0.5) * 2, vy: -2 - Math.random() * 3, life: 1, decay: 0.01 + Math.random() * 0.02, size: 10 + Math.random() * 10 });
    }

    function gameLoop(ts) {
        if (!gameLoop.last) gameLoop.last = ts;
        let dt = (ts - gameLoop.last) / 1000;
        if (dt > 0.15) dt = 0.15;
        gameLoop.last = ts;

        sponge.x = lerp(sponge.x, sponge.tx, 1 - Math.exp(-28 * dt));
        sponge.y = lerp(sponge.y, sponge.ty, 1 - Math.exp(-28 * dt));
        if (!scrubbing) sponge.squish = lerp(sponge.squish, 0, 1 - Math.exp(-12 * dt));

        if (scrubbing && gameState === 'playing') {
            sponge.squish = lerp(sponge.squish, 1, 1 - Math.exp(-20 * dt));
            let any = false;
            mud.forEach(s => {
                if (s.cleaned >= 1) return;
                const d = dist(sponge.x, sponge.y, s.x, s.y);
                const overlap = 26 + s.r - d;
                if (overlap > 0) {
                    const eff = clamp(overlap / (s.r + 26), 0.2, 1);
                    s.cleaned += eff * dt * 0.72;
                    if (s.cleaned > 1) s.cleaned = 1;
                    any = true;
                    if (Math.random() < dt * 18 * eff) {
                        bubbles.push({ x: s.x + (Math.random() - 0.5) * 20, y: s.y + (Math.random() - 0.5) * 20, r: 4 + Math.random() * 10, speed: 0.5 + Math.random() * 1.5, life: 1 });
                    }
                }
            });
            if (any) shake = lerp(shake, 1.2, 1 - Math.exp(-18 * dt));
        }
        shake = lerp(shake, 0, 1 - Math.exp(-10 * dt));
        if (shake < 0.03) shake = 0;

        if (gameState === 'playing') {
            const total = mud.reduce((a, s) => a + clamp(s.cleaned, 0, 1), 0);
            progress = (total / mud.length) * 100;
            if (progress >= 99.5) { progress = 100; gameState = 'done'; doneTimer = 0; mud.forEach(s => s.cleaned = 1); }
        }
        if (gameState === 'done') {
            doneTimer += dt;
            if (Math.random() < dt * 5 && doneTimer < 4) sparkles.push({ x: 120 + Math.random() * 160, y: 140 + Math.random() * 200, life: 1, r: 3 + Math.random() * 6 });
        }

        for (let i = bubbles.length - 1; i >= 0; i--) { bubbles[i].y -= bubbles[i].speed; bubbles[i].life -= dt * 0.4; if (bubbles[i].life <= 0 || bubbles[i].y < -30) bubbles.splice(i, 1); }
        for (let i = sparkles.length - 1; i >= 0; i--) { sparkles[i].life -= dt * 0.8; sparkles[i].y -= dt * 30; if (sparkles[i].life <= 0) sparkles.splice(i, 1); }
        for (let i = hearts.length - 1; i >= 0; i--) { hearts[i].x += hearts[i].vx; hearts[i].y += hearts[i].vy; hearts[i].vy += 0.08; hearts[i].life -= hearts[i].decay; if (hearts[i].life <= 0) hearts.splice(i, 1); }

        // 绘制
        ctx.clearRect(0, 0, W, H);
        // 背景
        const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
        bgGrad.addColorStop(0, '#f0f4f8'); bgGrad.addColorStop(0.5, '#fef5f7'); bgGrad.addColorStop(1, '#fdf6f0');
        ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);

        // 墙壁瓷砖装饰
        ctx.strokeStyle = 'rgba(200,180,175,0.1)'; ctx.lineWidth = 1;
        for (let x = 50; x < W; x += 50) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H - 120); ctx.stroke(); }
        for (let y = 40; y < H - 120; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

        drawTileFloor();
        drawPiggy();
        if (gameState === 'playing' || (gameState === 'done' && doneTimer < 1)) drawMud();

        // 泡泡
        bubbles.forEach(b => {
            ctx.save(); ctx.globalAlpha = b.life * 0.7;
            ctx.fillStyle = 'rgba(200,230,255,0.6)'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.3, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        });
        sparkles.forEach(s => { ctx.fillStyle = `rgba(255,220,100,${s.life})`; ctx.font = `${s.r * 3}px sans-serif`; ctx.fillText('✨', s.x - s.r, s.y); });
        hearts.forEach(h => { ctx.save(); ctx.globalAlpha = h.life; ctx.fillStyle = '#ff6b8a'; ctx.font = `${h.size}px sans-serif`; ctx.fillText('❤️', h.x - h.size / 2, h.y + h.size / 2); ctx.restore(); });

        drawSponge();
        drawProgress();
        drawUI();
        requestAnimationFrame(gameLoop);
    }
    gameLoop.last = 0;

    function pos(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) }; }

    function handleDown(p) {
        sponge.tx = p.x; sponge.ty = p.y; sponge.x = p.x; sponge.y = p.y;
        scrubbing = true; onCanvas = true;
        if (gameState === 'done') {
            if (p.x > 120 && p.x < 280 && p.y > 130 && p.y < 380) { for (let i = 0; i < 6; i++) spawnHeart(p.x, p.y); }
            if (doneTimer > 1.5) {
                const rbx = W / 2 - 55, rby = H / 2 + 8, rbw = 110, rbh = 36;
                if (p.x > rbx && p.x < rbx + rbw && p.y > rby && p.y < rby + rbh) {
                    progress = 0; gameState = 'playing'; doneTimer = 0;
                    mud.forEach(s => s.cleaned = 0); bubbles = []; sparkles = []; hearts = [];
                    return;
                }
            }
        }
    }

    canvas.addEventListener('mousedown', e => { e.preventDefault(); handleDown(pos(e)); });
    canvas.addEventListener('mousemove', e => { e.preventDefault(); const p = pos(e); sponge.tx = p.x; sponge.ty = p.y; onCanvas = true; });
    canvas.addEventListener('mouseup', e => { e.preventDefault(); scrubbing = false; sponge.squish = 0; });
    canvas.addEventListener('mouseleave', () => { onCanvas = false; scrubbing = false; sponge.squish = 0; });
    canvas.addEventListener('touchstart', e => { e.preventDefault(); handleDown(pos(e.touches[0])); }, { passive: false });
    canvas.addEventListener('touchmove', e => { e.preventDefault(); const p = pos(e.touches[0]); sponge.tx = p.x; sponge.ty = p.y; onCanvas = true; }, { passive: false });
    canvas.addEventListener('touchend', e => { e.preventDefault(); scrubbing = false; sponge.squish = 0; });

    requestAnimationFrame(gameLoop);
</script>
</body>
</html>
