<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>小猪洗澡澡</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    background:#fff6fb;

    overflow:hidden;

    font-family:
    "Arial",
    "Microsoft YaHei",
    sans-serif;

}


canvas{

    display:block;

    margin:auto;

    background:
    linear-gradient(
    #ffeef7,
    #dff8ff
    );

}



#tip{

position:absolute;

top:15px;

left:50%;

transform:translateX(-50%);

font-size:20px;

color:#ff8db8;

font-weight:bold;

}


</style>


</head>



<body>


<div id="tip">
🧽 帮小猪洗干净吧！
</div>


<canvas id="game"></canvas>



<script>


// ==========================
// Canvas
// ==========================


const canvas =
document.getElementById("game");


const ctx =
canvas.getContext("2d");



let W =
canvas.width =
window.innerWidth;


let H =
canvas.height =
window.innerHeight;



window.onresize=function(){

W=canvas.width=
window.innerWidth;


H=canvas.height=
window.innerHeight;

};




// ==========================
// 小猪图片
// ==========================


const pigImg =
new Image();


pigImg.src =
"./pig.png";



let pigLoaded=false;



pigImg.onload=function(){

    pigLoaded=true;

    console.log(
    "小猪加载成功"
    );

};



pigImg.onerror=function(){

    console.log(
    "小猪加载失败"
    );

};



// ==========================
// 小猪位置
// ==========================


let pig={

x:W/2-120,

y:H/2-120,

w:240,

h:240

};



// ==========================
// 小猪动画状态
// ==========================


let pigBounce=0;


let pigTilt=0;


let pigBlink=0;


let earShake=0;



// ==========================
// 泥巴
// ==========================


let dirt=100;



// ==========================
// 海绵
// ==========================


let sponge={

x:100,

y:H-160,

size:70,

drag:false

};



// ==========================
// 爱心
// ==========================


let hearts=[];



// ==========================
// 水滴
// ==========================


let drops=[];



// ==========================
// 鼠标位置
// ==========================


let mouse={

x:0,

y:0

};



canvas.addEventListener(
"mousemove",
e=>{

mouse.x=e.clientX;

mouse.y=e.clientY;


if(sponge.drag){

sponge.x=
mouse.x-sponge.size/2;


sponge.y=
mouse.y-sponge.size/2;

}


}
);




// ==========================
// 绘制背景泡泡
// ==========================


function drawBackground(){


    // 小泡泡

    for(let i=0;i<15;i++){


        let x =
        (i*97)%W;


        let y =
        (i*53)%H;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            8+i%6,
            0,
            Math.PI*2
        );


        ctx.fillStyle=
        "rgba(255,255,255,0.45)";


        ctx.fill();

    }


}




// ==========================
// 绘制小猪
// ==========================


function drawPig(){



if(!pigLoaded){

    // 图片没加载时提示

    ctx.fillStyle="#ffb6d9";

    ctx.beginPath();

    ctx.arc(
        pig.x+pig.w/2,
        pig.y+pig.h/2,
        80,
        0,
        Math.PI*2
    );

    ctx.fill();

    return;

}





ctx.save();



// 弹跳效果

let scaleX =
1 - pigBounce*0.015;


let scaleY =
1 + pigBounce*0.03;



// 耳朵抖动

ctx.translate(
pig.x+pig.w/2,
pig.y+pig.h/2
);



ctx.rotate(
pigTilt
);



ctx.scale(
scaleX,
scaleY
);




// 画小猪


ctx.drawImage(

pigImg,

-pig.w/2,

-pig.h/2,

pig.w,

pig.h

);



ctx.restore();





// 洗澡泥巴层


if(dirt>0){


    ctx.save();


    ctx.globalAlpha =
    dirt/100;



    ctx.fillStyle =
    "rgba(120,80,45,0.35)";



    ctx.beginPath();


    ctx.ellipse(

    pig.x+pig.w*0.5,

    pig.y+pig.h*0.35,

    pig.w*0.42,

    pig.h*0.25,

    0,

    0,

    Math.PI*2

    );


    ctx.fill();



    ctx.restore();


}





}





// ==========================
// 绘制海绵
// ==========================


function drawSponge(){



ctx.save();



ctx.fillStyle="#ffd34d";


ctx.beginPath();


ctx.arc(

sponge.x+sponge.size/2,

sponge.y+sponge.size/2,

sponge.size/2,

0,

Math.PI*2

);



ctx.fill();




ctx.fillStyle="#fff";


ctx.font="35px Arial";


ctx.fillText(

"🧽",

sponge.x+10,

sponge.y+45

);



ctx.restore();


}





// ==========================
// 爱心动画
// ==========================


function createHeart(x,y){


hearts.push({

x:x,

y:y,

life:60

});


}



function drawHearts(){



for(
let i=hearts.length-1;
i>=0;
i--
){


let h=hearts[i];


ctx.font="30px Arial";


ctx.fillText(

"❤️",

h.x,

h.y

);



h.y-=1;



h.life--;



if(h.life<=0){

hearts.splice(i,1);

}


}



}





// ==========================
// 水滴动画
// ==========================


function createDrop(x,y){


drops.push({

x:x,

y:y,

speed:2+Math.random()*2

});


}





function drawDrops(){



for(
let i=drops.length-1;
i>=0;
i--
){


let d=drops[i];



ctx.fillStyle=
"#8edcff";


ctx.beginPath();


ctx.arc(

d.x,

d.y,

5,

0,

Math.PI*2

);



ctx.fill();



d.y+=d.speed;



if(d.y>H){

drops.splice(i,1);

}



}


}






// ==========================
// 擦洗检测
// ==========================


function washCheck(){



if(!sponge.drag)
return;



let sx=
sponge.x+sponge.size/2;


let sy=
sponge.y+sponge.size/2;



let px=
pig.x+pig.w/2;


let py=
pig.y+pig.h/2;




let distance=
Math.sqrt(

(sx-px)*(sx-px)

+

(sy-py)*(sy-py)

);




if(distance<150 && dirt>0){



dirt-=0.5;



createDrop(
sx,
sy
);



}



if(dirt<0){

dirt=0;

}



}
// ==========================
// 小猪互动
// ==========================



function touchPig(x,y){



if(

x>pig.x &&

x<pig.x+pig.w &&

y>pig.y &&

y<pig.y+pig.h

){



// 弹一下

pigBounce=12;



// 耳朵抖

earShake=20;



// 开心爱心

createHeart(

pig.x+pig.w/2,

pig.y

);



}



}





// ==========================
// 自动眨眼
// ==========================


let blinkTime=0;



function updateBlink(){



blinkTime++;



// 每隔一段时间眨眼


if(blinkTime>180){


pigBlink=15;


blinkTime=0;


}



if(pigBlink>0){


pigBlink--;

}



}





// ==========================
// 绘制眨眼效果
// ==========================


function drawBlink(){



if(pigBlink<=0)
return;



ctx.save();



ctx.strokeStyle="#333";

ctx.lineWidth=5;



// 左眼

ctx.beginPath();


ctx.moveTo(

pig.x+pig.w*0.32,

pig.y+pig.h*0.40

);


ctx.lineTo(

pig.x+pig.w*0.40,

pig.y+pig.h*0.40

);


ctx.stroke();



// 右眼

ctx.beginPath();


ctx.moveTo(

pig.x+pig.w*0.60,

pig.y+pig.h*0.40

);


ctx.lineTo(

pig.x+pig.w*0.68,

pig.y+pig.h*0.40

);


ctx.stroke();



ctx.restore();



}





// ==========================
// 小猪弹性更新
// ==========================


function updatePig(){



// 弹回来


if(pigBounce>0){


pigBounce-=0.35;


}



if(pigBounce<0){


pigBounce=0;


}



// 耳朵抖动


if(earShake>0){



pigTilt =
Math.sin(
Date.now()/30
)
*
0.08;



earShake--;



}else{


pigTilt=0;


}



}




// ==========================
// 鼠标点击
// ==========================



canvas.addEventListener(

"mousedown",

e=>{


let rect =
canvas.getBoundingClientRect();



let x =
e.clientX-rect.left;



let y =
e.clientY-rect.top;



touchPig(x,y);



}

);




// ==========================
// 手机触摸
// ==========================



canvas.addEventListener(

"touchstart",

e=>{


e.preventDefault();



let rect =
canvas.getBoundingClientRect();



let touch =
e.touches[0];



let x =
touch.clientX-rect.left;



let y =
touch.clientY-rect.top;



touchPig(x,y);



},

{
passive:false
}

);






// ==========================
// 海绵拖动
// ==========================



canvas.addEventListener(

"mousedown",

e=>{


let rect =
canvas.getBoundingClientRect();



let x =
e.clientX-rect.left;


let y =
e.clientY-rect.top;




if(

x>sponge.x &&

x<sponge.x+sponge.size &&

y>sponge.y &&

y<sponge.y+sponge.size

){


sponge.drag=true;


}



});






canvas.addEventListener(

"mousemove",

e=>{


if(!sponge.drag)
return;



let rect =
canvas.getBoundingClientRect();



sponge.x =
e.clientX-rect.left-sponge.size/2;



sponge.y =
e.clientY-rect.top-sponge.size/2;



});






canvas.addEventListener(

"mouseup",

()=>{


sponge.drag=false;


});





// 手机拖动海绵


canvas.addEventListener(

"touchmove",

e=>{


e.preventDefault();



if(!sponge.drag)
return;



let rect =
canvas.getBoundingClientRect();


let t =
e.touches[0];



sponge.x =
t.clientX-rect.left-sponge.size/2;



sponge.y =
t.clientY-rect.top-sponge.size/2;



},

{
passive:false
}

);





canvas.addEventListener(

"touchend",

()=>{


sponge.drag=false;


});
// ==========================
// 游戏循环
// ==========================


function gameLoop(){



// 清空画布

ctx.clearRect(
0,
0,
W,
H
);




// 背景

drawBackground();




// 更新

updatePig();

updateBlink();

washCheck();




// 绘制

drawPig();

drawBlink();

drawSponge();

drawHearts();

drawDrops();




// 洗干净效果

if(dirt<=0){


ctx.font="40px Arial";


ctx.fillText(

"✨ 小猪洗干净啦！ ✨",

W/2-150,

100

);



happy=true;


}





requestAnimationFrame(
gameLoop
);



}





// ==========================
// 初始化位置调整
// ==========================


function resetGame(){



pig.x =
W/2-pig.w/2;


pig.y =
H/2-pig.h/2;



sponge.x=80;


sponge.y=
H-150;



}



resetGame();



// 开始游戏

gameLoop();


</script>

</body>

</html>
