<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🐷 给小猪洗澡</title>
    <style>
        :root {
            --bg-top: #e8f4f8;
            --bg-mid: #fce4ec;
            --bg-bot: #fff8e1;
            --canvas-bg: #fef9fb;
            --title-color: #d4687c;
            --hint-color: #b08a7a;
            --shadow-color: rgba(180, 140, 150, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 60%, var(--bg-bot) 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
            padding: 12px;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
            overflow: hidden;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            max-width: 420px;
            width: 100%;
        }

        .title {
            font-size: clamp(1.3rem, 4vw, 1.6rem);
            font-weight: 700;
            color: var(--title-color);
            letter-spacing: 0.06em;
            text-shadow: 1px 1px 0 rgba(255, 255, 255, 0.6);
            animation: titleFloat 3s ease-in-out infinite;
        }

        @keyframes titleFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-4px);
            }
        }

        .canvas-container {
            position: relative;
            border-radius: 28px;
            box-shadow:
                0 20px 40px var(--shadow-color),
                0 4px 12px rgba(0, 0, 0, 0.05),
                inset 0 0 0 2px rgba(255, 255, 255, 0.5);
            overflow: hidden;
            background: var(--canvas-bg);
            width: 100%;
            aspect-ratio: 400 / 520;
            max-height: 75vh;
            max-height: 75dvh;
            transition: transform 0.15s ease;
        }

        .canvas-container:active {
            transform: scale(0.995);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: none;
            touch-action: none;
        }

        .hint {
            color: var(--hint-color);
            font-size: 0.82rem;
            text-align: center;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 6px 18px;
            border-radius: 22px;
            letter-spacing: 0.03em;
            transition: opacity 0.4s;
        }

        .hint .pulse {
            display: inline-block;
            animation: hintPulse 1.5s ease-in-out infinite;
        }

        @keyframes hintPulse {
            0%,
            100% {
                opacity: 0.5;
                transform: scale(0.9);
            }
            50% {
                opacity: 1;
                transform: scale(1.15);
            }
        }

        @media (max-width: 420px) {
            .game-wrapper {
                gap: 5px;
            }
            .hint {
                font-size: 0.75rem;
                padding: 5px 14px;
            }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="title">🐷 给小猪洗澡 🫧</div>
        <div class="canvas-container">
            <canvas id="c" width="400" height="520" aria-label="给小猪洗澡互动游戏 - 按住擦洗泥巴"></canvas>
        </div>
        <div class="hint">
            <span class="pulse">✨</span> 按住擦洗泥巴 · 洗完点击小猪弹出爱心 <span class="pulse">✨</span>
        </div>
    </div>

    <script>
        (function() {
            // ==================== DOM 元素 ====================
            const canvas = document.getElementById('c');
            const ctx = canvas.getContext('2d');

            // ==================== 常量 & 配置 ====================
            const W = 400;
            const H = 520;

            /**
             * 颜色调色板 - 集中管理所有颜色，方便换肤
             */
            const COLORS = {
                pig: {
                    body: ['#ffdbe2', '#fcb5c2', '#f090a5'],
                    bodyHighlight: 'rgba(255,255,255,0.35)',
                    ear: ['#ffcdd8', '#faa0b2', '#e87a90'],
                    earInner: 'rgba(255,190,190,0.5)',
                    nose: ['#ffced8', '#f090a5'],
                    nostril: '#a14b5a',
                    leg: ['#f7a8b8', '#d18a98'],
                    blush: 'rgba(255,160,160,0.4)',
                    eyeWhite: '#ffffff',
                    eyePupil: '#2a1018',
                    mouth: '#c45a6a',
                    tail: '#f7a8b8'
                },
                sponge: {
                    body: ['#ffe680', '#ffd54f', '#f0a830'],
                    highlight: 'rgba(255,255,255,0.35)',
                    shadow: 'rgba(0,0,0,0.1)',
                    hole: 'rgba(200,140,40,0.45)',
                    drip: 'rgba(180,210,240,0.7)'
                },
                mud: {
                    center: 'rgba(90,55,35,0.9)',
                    mid: 'rgba(75,45,28,0.7)',
                    edge: 'rgba(50,30,18,0)'
                },
                tiles: {
                    baseHue: 25,
                    saturation: '30%',
                    lightness: '87%',
                    highlight: 'rgba(255,255,255,0.6)',
                    shadow: 'rgba(180,150,140,0.3)',
                    dot: 'rgba(200,170,155,0.2)'
                },
                progress: {
                    bg: 'rgba(0,0,0,0.06)',
                    track: '#f5e8e0',
                    fill: ['#8dd4ec', '#5db8d8', '#a0ddf2'],
                    text: '#5a4030'
                },
                background: {
                    wallLine: 'rgba(200,180,175,0.1)',
                    top: '#f0f4f8',
                    mid: '#fef5f7',
                    bottom: '#fdf6f0'
                },
                ui: {
                    overlay: 'rgba(255,250,245,0.5)',
                    title: 'rgba(210,100,120,1)',
                    buttonBg: 'rgba(255,255,255,0.9)',
                    buttonStroke: 'rgba(220,140,150,1)',
                    buttonText: 'rgba(200,90,110,1)',
                    star: 'rgba(255,220,100,1)',
                    heart: '#ff6b8a'
                },
                bubble: {
                    body: 'rgba(200,230,255,0.6)',
                    highlight: 'rgba(255,255,255,0.5)'
                }
            };

            /**
             * 小猪位置参数 - 所有坐标集中管理
             */
            const PIG = {
                centerX: W / 2,
                bodyY: 285,
                headY: 160,
                bodyRX: 75,
                bodyRY: 65,
                headRadius: 52,
                earOffsetX: 26,
                earOffsetY: -8,
                earAngleL: -0.25,
                earAngleR: 0.2,
                eyeOffsetX: 16,
                eyeOffsetY: 18,
                eyeRadius: 10,
                pupilRadius: 6.5,
                highlightRadius1: 3,
                highlightRadius2: 1.5,
                noseOffsetX: 8,
                noseOffsetY: 40,
                noseRX: 22,
                noseRY: 16,
                nostrilOffsetX: 8,
                nostrilOffsetY: 1,
                nostrilRadius: 4,
                blushOffsetX: 28,
                blushOffsetY: 32,
                blushRadius: 10,
                legBaseY: 210,
                legSpread: 32,
                legInnerSpread: 18,
                tailStartX: 65,
                tailStartY: 120,
            };

            /** 地砖参数 */
            const TILE = {
                width: 58,
                height: 55,
                cols: 7,
                rows: 2,
            };

            /** 进度条参数 */
            const PROGRESS_BAR = {
                width: 240,
                height: 12,
                y: 16,
                radius: 10,
            };

            /** 海绵参数 */
            const SPONGE = {
                radius: 26,
                width: 32,
                height: 22,
            };

            // ==================== 游戏状态 ====================
            let progress = 0;
            let gameState = 'playing'; // 'playing' | 'done'
            let doneTimer = 0;
            let shakeAmount = 0;
            let spongeSquish = 0;
            let isScrubbing = false;
            let isPointerOnCanvas = false;

            /** 海绵位置 */
            const sponge = { x: W / 2, y: H / 2, tx: W / 2, ty: W / 2 };

            /** 粒子数组 */
            let mudSpots = [];
            let bubbles = [];
            let sparkles = [];
            let hearts = [];

            /** 预计算的静态渐变缓存 */
            let staticGradients = null;

            // ==================== 初始化 ====================
            function initMudSpots() {
                mudSpots = [];
                for (let i = 0; i < 14; i++) {
                    mudSpots.push({
                        x: 120 + Math.random() * 160,
                        y: 150 + Math.random() * 230,
                        r: 8 + Math.random() * 15,
                        cleaned: 0,
                        maxClean: 1,
                    });
                }
            }

            function resetGame() {
                progress = 0;
                gameState = 'playing';
                doneTimer = 0;
                shakeAmount = 0;
                spongeSquish = 0;
                isScrubbing = false;
                sponge.x = W / 2;
                sponge.y = H / 2;
                sponge.tx = W / 2;
                sponge.ty = H / 2;
                initMudSpots();
                bubbles = [];
                sparkles = [];
                hearts = [];
            }

            // ==================== 工具函数 ====================
            function dist(x1, y1, x2, y2) {
                return Math.hypot(x1 - x2, y1 - y2);
            }

            function lerp(a, b, t) {
                return a + (b - a) * t;
            }

            function clamp(v, min, max) {
                return Math.max(min, Math.min(max, v));
            }

            function rand(min, max) {
                return min + Math.random() * (max - min);
            }

            // ==================== roundRect Polyfill ====================
            if (!ctx.roundRect) {
                ctx.roundRect = function(x, y, w, h, r) {
                    if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
                    if (!r) r = { tl: 0, tr: 0, br: 0, bl: 0 };
                    ctx.beginPath();
                    ctx.moveTo(x + r.tl, y);
                    ctx.lineTo(x + w - r.tr, y);
                    ctx.quadraticCurveTo(x + w, y, x + w, y + r.tr);
                    ctx.lineTo(x + w, y + h - r.br);
                    ctx.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
                    ctx.lineTo(x + r.bl, y + h);
                    ctx.quadraticCurveTo(x, y + h, x, y + h - r.bl);
                    ctx.lineTo(x, y + r.tl);
                    ctx.quadraticCurveTo(x, y, x + r.tl, y);
                    ctx.closePath();
                };
            }

            // ==================== 渐变缓存 ====================
            function createStaticGradients() {
                const cx = PIG.centerX;
                const by = PIG.bodyY;
                const hy = PIG.headY;

                // 身体渐变
                const bodyGrad = ctx.createRadialGradient(cx - 5, by + 140, 20, cx, by + 145, 90);
                bodyGrad.addColorStop(0, COLORS.pig.body[0]);
                bodyGrad.addColorStop(0.6, COLORS.pig.body[1]);
                bodyGrad.addColorStop(1, COLORS.pig.body[2]);

                // 身体高光
                const bodyHL = ctx.createRadialGradient(cx - 15, by + 120, 8, cx, by + 145, 65);
                bodyHL.addColorStop(0, COLORS.pig.bodyHighlight);
                bodyHL.addColorStop(1, 'rgba(255,255,255,0)');

                // 头部渐变
                const headGrad = ctx.createRadialGradient(cx - 3, hy + 20, 10, cx, hy + 25, 55);
                headGrad.addColorStop(0, '#ffe8ed');
                headGrad.addColorStop(0.7, COLORS.pig.body[1]);
                headGrad.addColorStop(1, COLORS.pig.body[2]);

                // 鼻子渐变
                const snX = cx + PIG.noseOffsetX;
                const snY = hy + PIG.noseOffsetY;
                const noseGrad = ctx.createRadialGradient(snX - 2, snY - 3, 3, snX, snY, 22);
                noseGrad.addColorStop(0, COLORS.pig.nose[0]);
                noseGrad.addColorStop(1, COLORS.pig.nose[1]);

                return { bodyGrad, bodyHL, headGrad, noseGrad };
            }

            // ==================== 绘制函数 ====================
            function drawBackground() {
                const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
                bgGrad.addColorStop(0, COLORS.background.top);
                bgGrad.addColorStop(0.5, COLORS.background.mid);
                bgGrad.addColorStop(1, COLORS.background.bottom);
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, W, H);

                // 墙壁瓷砖装饰线
                ctx.strokeStyle = COLORS.background.wallLine;
                ctx.lineWidth = 1;
                const tileYEnd = H - TILE.rows * TILE.height + 5;
                for (let x = 50; x < W; x += 50) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, tileYEnd);
                    ctx.stroke();
                }
                for (let y = 40; y < tileYEnd; y += 40) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(W, y);
                    ctx.stroke();
                }
            }

            function drawTileFloor() {
                const startX = (W - TILE.cols * TILE.width) / 2;
                const startY = H - TILE.rows * TILE.height;
                const { baseHue, saturation, lightness, highlight, dot } = COLORS.tiles;

                for (let row = 0; row < TILE.rows; row++) {
                    for (let col = 0; col < TILE.cols; col++) {
                        const x = startX + col * TILE.width;
                        const y = startY + row * TILE.height;
                        const hue = baseHue + (row + col) * 4;

                        // 地砖主体
                        ctx.fillStyle = `hsl(${hue}, ${saturation}, ${lightness})`;
                        ctx.beginPath();
                        ctx.roundRect(x + 2, y + 2, TILE.width - 4, TILE.height - 4, 8);
                        ctx.fill();

                        // 高光边框
                        ctx.strokeStyle = highlight;
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.roundRect(x + 2, y + 2, TILE.width - 4, TILE.height - 4, 8);
                        ctx.stroke();

                        // 中心装饰圆点
                        ctx.fillStyle = dot;
                        ctx.beginPath();
                        ctx.arc(x + TILE.width / 2, y + TILE.height / 2, 3.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            function drawEar(x, y, angle) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);

                const earGrad = ctx.createLinearGradient(0, -18, 0, 12);
                earGrad.addColorStop(0, COLORS.pig.ear[0]);
                earGrad.addColorStop(0.6, COLORS.pig.ear[1]);
                earGrad.addColorStop(1, COLORS.pig.ear[2]);
                ctx.fillStyle = earGrad;
                ctx.beginPath();
                ctx.moveTo(-8, 6);
                ctx.quadraticCurveTo(-15, -14, -5, -22);
                ctx.quadraticCurveTo(7, -12, 10, 4);
                ctx.quadraticCurveTo(4, 9, -8, 6);
                ctx.fill();

                // 内耳
                ctx.fillStyle = COLORS.pig.earInner;
                ctx.beginPath();
                ctx.moveTo(-5, 4);
                ctx.quadraticCurveTo(-10, -9, -2, -15);
                ctx.quadraticCurveTo(4, -7, 6, 2);
                ctx.quadraticCurveTo(2, 6, -5, 4);
                ctx.fill();

                ctx.restore();
            }

            function drawLeg(x, y) {
                // 腿部
                ctx.fillStyle = COLORS.pig.leg[0];
                ctx.beginPath();
                ctx.roundRect(x - 10, y - 4, 20, 28, 10);
                ctx.fill();
                // 蹄子
                ctx.fillStyle = COLORS.pig.leg[1];
                ctx.beginPath();
                ctx.roundRect(x - 8, y + 18, 16, 10, 5);
                ctx.fill();
            }

            function drawEye(x, y, isStarEye) {
                // 眼白
                ctx.fillStyle = COLORS.pig.eyeWhite;
                ctx.beginPath();
                ctx.arc(x, y, PIG.eyeRadius, 0, Math.PI * 2);
                ctx.fill();

                // 瞳孔
                ctx.fillStyle = COLORS.pig.eyePupil;
                ctx.beginPath();
                ctx.arc(x + 1, y, PIG.pupilRadius, 0, Math.PI * 2);
                ctx.fill();

                // 主高光
                ctx.fillStyle = COLORS.pig.eyeWhite;
                ctx.beginPath();
                ctx.arc(x - 2, y - 4, PIG.highlightRadius1, 0, Math.PI * 2);
                ctx.fill();

                // 次高光
                ctx.beginPath();
                ctx.arc(x + 4, y + 2, PIG.highlightRadius2, 0, Math.PI * 2);
                ctx.fill();

                // 星星眼
                if (isStarEye) {
                    ctx.fillStyle = COLORS.pig.eyeWhite;
                    ctx.font = '10px sans-serif';
                    ctx.fillText('✨', x - 6, y - 8);
                }
            }

            function drawPiggy() {
                ctx.save();

                // 震动效果
                const sx = shakeAmount * (Math.random() - 0.5) * 2;
                const sy = shakeAmount * (Math.random() - 0.5) * 2;
                ctx.translate(sx, sy);

                const cx = PIG.centerX;
                const by = PIG.bodyY;
                const hy = PIG.headY;

                // --- 尾巴 ---
                ctx.strokeStyle = COLORS.pig.tail;
                ctx.lineWidth = 3.5;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(cx + PIG.tailStartX, by + PIG.tailStartY - 165);
                ctx.quadraticCurveTo(cx + 88, by + 100 - 165, cx + 72, by + 82 - 165);
                ctx.quadraticCurveTo(cx + 58, by + 74 - 165, cx + 55, by + 90 - 165);
                ctx.stroke();

                // --- 后腿 ---
                drawLeg(cx - PIG.legSpread, by + PIG.legBaseY - 165);
                drawLeg(cx + PIG.legSpread - 2, by + PIG.legBaseY - 2 - 165);

                // --- 身体 ---
                const bodyYAdjusted = by + 155 - 165;
                ctx.fillStyle = staticGradients.bodyGrad;
                ctx.beginPath();
                ctx.ellipse(cx, bodyYAdjusted, PIG.bodyRX, PIG.bodyRY, 0, 0, Math.PI * 2);
                ctx.fill();

                // 身体高光
                ctx.fillStyle = staticGradients.bodyHL;
                ctx.beginPath();
                ctx.ellipse(cx, bodyYAdjusted, PIG.bodyRX - 5, PIG.bodyRY - 5, 0, 0, Math.PI * 2);
                ctx.fill();

                // --- 前腿 ---
                drawLeg(cx - PIG.legInnerSpread, by + PIG.legBaseY + 5 - 165);
                drawLeg(cx + PIG.legInnerSpread - 2, by + PIG.legBaseY + 4 - 165);

                // --- 头部 ---
                const headYAdjusted = hy + 25 - 165;
                ctx.fillStyle = staticGradients.headGrad;
                ctx.beginPath();
                ctx.arc(cx, headYAdjusted, PIG.headRadius, 0, Math.PI * 2);
                ctx.fill();

                // --- 耳朵 ---
                drawEar(cx - PIG.earOffsetX, headYAdjusted + PIG.earOffsetY, PIG.earAngleL);
                drawEar(cx + PIG.earOffsetX - 2, headYAdjusted + PIG.earOffsetY - 2, PIG.earAngleR);

                // --- 鼻子 ---
                const snX = cx + PIG.noseOffsetX;
                const snY = headYAdjusted + PIG.noseOffsetY;
                ctx.fillStyle = staticGradients.noseGrad;
                ctx.beginPath();
                ctx.ellipse(snX, snY, PIG.noseRX, PIG.noseRY, 0, 0, Math.PI * 2);
                ctx.fill();

                // 鼻孔
                ctx.fillStyle = COLORS.pig.nostril;
                ctx.beginPath();
                ctx.arc(snX - PIG.nostrilOffsetX, snY + PIG.nostrilOffsetY, PIG.nostrilRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(snX + PIG.nostrilOffsetX, snY + PIG.nostrilOffsetY, PIG.nostrilRadius, 0, Math.PI * 2);
                ctx.fill();

                // --- 腮红 ---
                ctx.fillStyle = COLORS.pig.blush;
                ctx.beginPath();
                ctx.arc(cx - PIG.blushOffsetX, headYAdjusted + PIG.blushOffsetY - 30, PIG.blushRadius, 0, Math.PI *
                    2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(cx + PIG.blushOffsetX, headYAdjusted + PIG.blushOffsetY - 32, PIG.blushRadius, 0, Math.PI *
                    2);
                ctx.fill();

                // --- 眼睛 ---
                const isStarEye = gameState === 'done' && doneTimer > 1.2;
                drawEye(cx - PIG.eyeOffsetX, headYAdjusted + PIG.eyeOffsetY - 30, isStarEye);
                drawEye(cx + PIG.eyeOffsetX + 2, headYAdjusted + PIG.eyeOffsetY - 31, isStarEye);

                // --- 嘴巴 ---
                ctx.strokeStyle = COLORS.pig.mouth;
                ctx.lineWidth = 2;
                ctx.beginPath();
                if (gameState === 'done') {
                    ctx.arc(snX, snY + 10, 10, 0.2, Math.PI - 0.2);
                } else if (progress > 60) {
                    ctx.arc(snX, snY + 10, 7, 0.3, Math.PI - 0.3);
                } else {
                    ctx.arc(snX, snY + 18, 7, Math.PI + 0.3, -0.3);
                }
                ctx.stroke();

                ctx.restore();
            }

            function drawMud() {
                mudSpots.forEach(spot => {
                    if (spot.cleaned >= spot.maxClean) return;
                    const alpha = clamp(1 - spot.cleaned / spot.maxClean, 0, 1);
                    const grad = ctx.createRadialGradient(spot.x, spot.y, spot.r * 0.2, spot.x, spot.y, spot.r);
                    grad.addColorStop(0, COLORS.mud.center.replace('0.9', (alpha * 0.9).toString()));
                    grad.addColorStop(0.6, COLORS.mud.mid.replace('0.7', (alpha * 0.7).toString()));
                    grad.addColorStop(1, COLORS.mud.edge);
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(spot.x, spot.y, spot.r, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            function drawSponge() {
                if (!isPointerOnCanvas && !isScrubbing) {
                    // 绘制引导圈
                    const alpha = 0.15 + Math.sin(Date.now() / 800) * 0.08;
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.strokeStyle = '#ffb6c1';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    ctx.arc(sponge.x, sponge.y, SPONGE.radius - 2, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.restore();
                    return;
                }

                ctx.save();
                ctx.translate(sponge.x, sponge.y);
                const sq = spongeSquish;

                // 阴影
                ctx.fillStyle = COLORS.sponge.shadow;
                ctx.beginPath();
                ctx.roundRect(-16 + sq * 3, -10 + sq * 2, SPONGE.width - sq * 6, SPONGE.height + sq * 3, 7);
                ctx.fill();

                // 主体
                const spongeGrad = ctx.createLinearGradient(0, -14, 0, 14 + sq);
                spongeGrad.addColorStop(0, COLORS.sponge.body[0]);
                spongeGrad.addColorStop(0.4, COLORS.sponge.body[1]);
                spongeGrad.addColorStop(1, COLORS.sponge.body[2]);
                ctx.fillStyle = spongeGrad;
                ctx.beginPath();
                ctx.roundRect(-15 + sq * 3, -11 + sq, SPONGE.width - 2 - sq * 6, SPONGE.height - 2 + sq * 2, 6);
                ctx.fill();

                // 高光
                ctx.fillStyle = COLORS.sponge.highlight;
                ctx.beginPath();
                ctx.roundRect(-10 + sq * 2, -7 + sq, 14 - sq * 4, 6, 3);
                ctx.fill();

                // 擦洗时水滴
                if (isScrubbing && spongeSquish > 0.3) {
                    ctx.fillStyle = COLORS.sponge.drip;
                    for (let i = 0; i < 3; i++) {
                        const dx = rand(-12, 12);
                        const dy = rand(8, 16);
                        ctx.beginPath();
                        ctx.arc(dx, dy, rand(1.5, 3), 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                ctx.restore();
            }

            function drawProgressBar() {
                const { width, height, y, radius } = PROGRESS_BAR;
                const bx = (W - width) / 2;
                const by = y;

                // 背景
                ctx.fillStyle = COLORS.progress.bg;
                ctx.beginPath();
                ctx.roundRect(bx - 2, by - 2, width + 4, height + 4, radius);
                ctx.fill();

                // 轨道
                ctx.fillStyle = COLORS.progress.track;
                ctx.beginPath();
                ctx.roundRect(bx, by, width, height, radius - 2);
                ctx.fill();

                // 进度填充
                const pw = (progress / 100) * width;
                if (pw > 0) {
                    const pg = ctx.createLinearGradient(bx, 0, bx + width, 0);
                    pg.addColorStop(0, COLORS.progress.fill[0]);
                    pg.addColorStop(0.5, COLORS.progress.fill[1]);
                    pg.addColorStop(1, COLORS.progress.fill[2]);
                    ctx.fillStyle = pg;
                    ctx.beginPath();
                    ctx.roundRect(bx, by, pw, height, radius - 2);
                    ctx.fill();

                    // 填充光泽
                    ctx.fillStyle = 'rgba(255,255,255,0.25)';
                    ctx.beginPath();
                    ctx.roundRect(bx, by, pw, height / 2, [radius - 2, radius - 2, 0, 0]);
                    ctx.fill();
                }

                // 文字
                ctx.fillStyle = COLORS.progress.text;
                ctx.font = 'bold 10px "PingFang SC", "Microsoft YaHei", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`干净 ${Math.round(progress)}%`, W / 2, by + height - 2);
            }

            function drawCompletionUI() {
                if (gameState !== 'done') return;

                // 半透明覆盖（带脉冲）
                const pulse = Math.sin(Date.now() / 500) * 0.06 + 0.44;
                const overlayAlpha = clamp(doneTimer / 1.5, 0, pulse);
                ctx.fillStyle = COLORS.ui.overlay.replace('0.5', overlayAlpha.toString());
                ctx.fillRect(0, 0, W, H);

                // 标题文字
                if (doneTimer > 0.8) {
                    const textAlpha = clamp((doneTimer - 0.8) / 0.5, 0, 1);
                    const rotation = Date.now() / 1200;

                    ctx.save();
                    ctx.globalAlpha = textAlpha;
                    ctx.translate(W / 2, H / 2 - 28);
                    ctx.rotate(Math.sin(rotation) * 0.04);

                    ctx.fillStyle = COLORS.ui.title;
                    ctx.font = 'bold 26px "PingFang SC", "Microsoft YaHei", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('✨ 香香小猪 ✨', 0, 0);
                    ctx.restore();
                }

                // 重新开始按钮
                if (doneTimer > 1.5) {
                    const btnAlpha = clamp((doneTimer - 1.5) / 0.4, 0, 1);
                    const btnX = W / 2 - 55;
                    const btnY = H / 2 + 6;
                    const btnW = 110;
                    const btnH = 38;

                    ctx.globalAlpha = btnAlpha;
                    ctx.fillStyle = COLORS.ui.buttonBg;
                    ctx.strokeStyle = COLORS.ui.buttonStroke;
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.roundRect(btnX, btnY, btnW, btnH, 19);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = COLORS.ui.buttonText;
                    ctx.font = 'bold 16px "PingFang SC", "Microsoft YaHei", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('🔄 再洗一次', W / 2, btnY + 26);
                    ctx.globalAlpha = 1;
                }
            }

            function drawParticles() {
                // 泡泡
                bubbles.forEach(b => {
                    ctx.save();
                    ctx.globalAlpha = b.life * 0.7;
                    ctx.fillStyle = COLORS.bubble.body;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = COLORS.bubble.highlight;
                    ctx.beginPath();
                    ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                // 星星
                sparkles.forEach(s => {
                    ctx.fillStyle = COLORS.ui.star.replace('1', s.life.toString());
                    ctx.font = `${s.r * 3}px sans-serif`;
                    ctx.fillText('✨', s.x - s.r, s.y);
                });

                // 爱心
                hearts.forEach(h => {
                    ctx.save();
                    ctx.globalAlpha = h.life;
                    ctx.fillStyle = COLORS.ui.heart;
                    ctx.font = `${h.size}px sans-serif`;
                    ctx.fillText('❤️', h.x - h.size / 2, h.y + h.size / 2);
                    ctx.restore();
                });
            }

            // ==================== 粒子系统 ====================
            function spawnBubble(x, y) {
                bubbles.push({
                    x: x + rand(-10, 10),
                    y: y + rand(-8, 8),
                    r: 4 + Math.random() * 10,
                    speed: 0.5 + Math.random() * 1.5,
                    life: 1,
                });
            }

            function spawnHeart(x, y) {
                hearts.push({
                    x,
                    y,
                    vx: rand(-1.5, 1.5),
                    vy: -2 - Math.random() * 3,
                    life: 1,
                    decay: 0.01 + Math.random() * 0.02,
                    size: 10 + Math.random() * 10,
                });
            }

            function spawnSparkle(x, y) {
                sparkles.push({
                    x: x + rand(-20, 20),
                    y: y + rand(-15, 15),
                    life: 1,
                    r: 3 + Math.random() * 6,
                });
            }

            function updateParticles(dt) {
                // 更新泡泡
                for (let i = bubbles.length - 1; i >= 0; i--) {
                    const b = bubbles[i];
                    b.y -= b.speed;
                    b.life -= dt * 0.4;
                    if (b.life <= 0 || b.y < -30) bubbles.splice(i, 1);
                }

                // 更新星星
                for (let i = sparkles.length - 1; i >= 0; i--) {
                    const s = sparkles[i];
                    s.life -= dt * 0.8;
                    s.y -= dt * 30;
                    if (s.life <= 0) sparkles.splice(i, 1);
                }

                // 更新爱心
                for (let i = hearts.length - 1; i >= 0; i--) {
                    const h = hearts[i];
                    h.x += h.vx;
                    h.y += h.vy;
                    h.vy += 0.08;
                    h.life -= h.decay;
                    if (h.life <= 0) hearts.splice(i, 1);
                }
            }

            // ==================== 游戏逻辑 ====================
            function updateGameLogic(dt) {
                // 海绵平滑移动
                sponge.x = lerp(sponge.x, sponge.tx, 1 - Math.exp(-28 * dt));
                sponge.y = lerp(sponge.y, sponge.ty, 1 - Math.exp(-28 * dt));
                if (!isScrubbing) {
                    spongeSquish = lerp(spongeSquish, 0, 1 - Math.exp(-12 * dt));
                }

                // 擦洗逻辑
                if (isScrubbing && gameState === 'playing') {
                    spongeSquish = lerp(spongeSquish, 1, 1 - Math.exp(-20 * dt));
                    let anyCleaned = false;

                    mudSpots.forEach(spot => {
                        if (spot.cleaned >= spot.maxClean) return;
                        const d = dist(sponge.x, sponge.y, spot.x, spot.y);
                        const overlap = SPONGE.radius + spot.r - d;
                        if (overlap > 0) {
                            const efficiency = clamp(overlap / (spot.r + SPONGE.radius), 0.2, 1);
                            spot.cleaned += efficiency * dt * 0.72;
                            if (spot.cleaned > spot.maxClean) spot.cleaned = spot.maxClean;
                            anyCleaned = true;
                            if (Math.random() < dt * 18 * efficiency) {
                                spawnBubble(spot.x, spot.y);
                            }
                        }
                    });

                    if (anyCleaned) {
                        shakeAmount = lerp(shakeAmount, 1.2, 1 - Math.exp(-18 * dt));
                    }
                }

                // 震动衰减
                shakeAmount = lerp(shakeAmount, 0, 1 - Math.exp(-10 * dt));
                if (shakeAmount < 0.03) shakeAmount = 0;

                // 计算进度
                if (gameState === 'playing') {
                    const totalCleaned = mudSpots.reduce((acc, s) => acc + clamp(s.cleaned / s.maxClean, 0, 1), 0);
                    progress = (totalCleaned / mudSpots.length) * 100;

                    if (progress >= 99.5) {
                        progress = 100;
                        gameState = 'done';
                        doneTimer = 0;
                        mudSpots.forEach(s => (s.cleaned = s.maxClean));
                    }
                }

                // 完成状态
                if (gameState === 'done') {
                    doneTimer += dt;
                    if (Math.random() < dt * 5 && doneTimer < 4) {
                        spawnSparkle(120 + Math.random() * 160, 140 + Math.random() * 200);
                    }
                }
            }

            // ==================== 坐标转换 ====================
            function getCanvasCoords(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * (W / rect.width),
                    y: (clientY - rect.top) * (H / rect.height),
                };
            }

            // ==================== 事件处理 ====================
            function handlePointerDown(p) {
                sponge.tx = p.x;
                sponge.ty = p.y;
                sponge.x = p.x;
                sponge.y = p.y;
                isScrubbing = true;
                isPointerOnCanvas = true;

                // 完成状态：检测点击小猪
                if (gameState === 'done') {
                    if (p.x > 110 && p.x < 290 && p.y > 130 && p.y < 370) {
                        for (let i = 0; i < 6; i++) spawnHeart(p.x, p.y);
                    }
                    // 检测重新开始按钮
                    if (doneTimer > 1.5) {
                        const btnX = W / 2 - 55;
                        const btnY = H / 2 + 6;
                        const btnW = 110;
                        const btnH = 38;
                        if (p.x > btnX && p.x < btnX + btnW && p.y > btnY && p.y < btnY + btnH) {
                            resetGame();
                            return;
                        }
                    }
                }
            }

            function handlePointerMove(p) {
                sponge.tx = p.x;
                sponge.ty = p.y;
                isPointerOnCanvas = true;
            }

            function handlePointerUp() {
                isScrubbing = false;
                spongeSquish = 0;
            }

            function handlePointerLeave() {
                isPointerOnCanvas = false;
                isScrubbing = false;
                spongeSquish = 0;
            }

            // 鼠标事件
            canvas.addEventListener('mousedown', e => {
                e.preventDefault();
                handlePointerDown(getCanvasCoords(e));
            });
            canvas.addEventListener('mousemove', e => {
                e.preventDefault();
                handlePointerMove(getCanvasCoords(e));
            });
            canvas.addEventListener('mouseup', e => {
                e.preventDefault();
                handlePointerUp();
            });
            canvas.addEventListener('mouseleave', () => {
                handlePointerLeave();
            });

            // 触摸事件
            canvas.addEventListener(
                'touchstart',
                e => {
                    e.preventDefault();
                    if (e.touches.length > 0) {
                        handlePointerDown(getCanvasCoords(e));
                    }
                }, { passive: false }
            );
            canvas.addEventListener(
                'touchmove',
                e => {
                    e.preventDefault();
                    if (e.touches.length > 0) {
                        handlePointerMove(getCanvasCoords(e));
                    }
                }, { passive: false }
            );
            canvas.addEventListener('touchend', e => {
                e.preventDefault();
                handlePointerUp();
            });
            canvas.addEventListener('touchcancel', e => {
                e.preventDefault();
                handlePointerUp();
                handlePointerLeave();
            });

            // 全局释放
            document.addEventListener('mouseup', () => {
                if (isScrubbing) handlePointerUp();
            });

            // ==================== 主循环 ====================
            function render() {
                ctx.clearRect(0, 0, W, H);
                drawBackground();
                drawTileFloor();
                drawPiggy();
                if (gameState === 'playing' || (gameState === 'done' && doneTimer < 1)) {
                    drawMud();
                }
                drawParticles();
                drawSponge();
                drawProgressBar();
                drawCompletionUI();
            }

            function gameLoop(timestamp) {
                if (!gameLoop.lastTime) gameLoop.lastTime = timestamp;
                let dt = (timestamp - gameLoop.lastTime) / 1000;
                if (dt > 0.15) dt = 0.15; // 防止大帧跳跃
                gameLoop.lastTime = timestamp;

                updateGameLogic(dt);
                updateParticles(dt);
                render();

                requestAnimationFrame(gameLoop);
            }
            gameLoop.lastTime = 0;

            // ==================== 启动 ====================
            function init() {
                resetGame();
                staticGradients = createStaticGradients();
                requestAnimationFrame(gameLoop);
            }

            init();
        })();
    </script>
</body>
</html>
