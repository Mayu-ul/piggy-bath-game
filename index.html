<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🐷 给小猪洗澡</title>
    <style>
        :root {
            --bg-top: #e8f4f8;
            --bg-mid: #fce4ec;
            --bg-bot: #fff8e1;
            --title-color: #d4687c;
            --hint-color: #b08a7a;
            --shadow-color: rgba(180, 140, 150, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 60%, var(--bg-bot) 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
            padding: 12px;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            max-width: 420px;
            width: 100%;
        }

        .title {
            font-size: clamp(1.3rem, 4vw, 1.6rem);
            font-weight: 700;
            color: var(--title-color);
            letter-spacing: 0.06em;
            text-shadow: 1px 1px 0 rgba(255, 255, 255, 0.6);
            animation: titleFloat 3s ease-in-out infinite;
        }

        @keyframes titleFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-4px);
            }
        }

        .canvas-container {
            position: relative;
            border-radius: 28px;
            box-shadow:
                0 20px 40px var(--shadow-color),
                0 4px 12px rgba(0, 0, 0, 0.05),
                inset 0 0 0 2px rgba(255, 255, 255, 0.5);
            overflow: hidden;
            background: #fef9fb;
            width: 100%;
            aspect-ratio: 400 / 520;
            max-height: 75vh;
            max-height: 75dvh;
            transition: transform 0.15s ease;
        }

        .canvas-container:active {
            transform: scale(0.995);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: none;
            touch-action: none;
        }

        .hint {
            color: var(--hint-color);
            font-size: 0.82rem;
            text-align: center;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 6px 18px;
            border-radius: 22px;
            letter-spacing: 0.03em;
        }

        .hint .pulse {
            display: inline-block;
            animation: hintPulse 1.5s ease-in-out infinite;
        }

        @keyframes hintPulse {
            0%,
            100% {
                opacity: 0.5;
                transform: scale(0.9);
            }
            50% {
                opacity: 1;
                transform: scale(1.15);
            }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="title">🐷 给小猪洗澡 🫧</div>
        <div class="canvas-container">
            <canvas id="c" width="400" height="520" aria-label="给小猪洗澡互动游戏"></canvas>
        </div>
        <div class="hint">
            <span class="pulse">✨</span> 按住擦洗泥巴 · 洗完点击小猪弹出爱心 <span class="pulse">✨</span>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('c');
            const ctx = canvas.getContext('2d');
            const W = 400;
            const H = 520;

            // ============ 加载你的 PNG 小猪图片 ============
   const pigImg = new Image();
pigImg.src = './pig2.png?v=2';

    let pigLoaded = false;

    pigImg.onload = function(){
        pigLoaded = true;
        console.log("小猪加载成功");
    };

    pigImg.onerror = function(){
        console.log("小猪加载失败");
    };
            // ============ 游戏状态 ============
            let progress = 0;
            let gameState = 'playing'; // 'playing' | 'done'
            let doneTimer = 0;
            // 小猪互动动画

let pigBounce = 0;
let pigBlink = 0;
let blinkTimer = 0;
            let spongeSquish = 0;
            let isScrubbing = false;
            let isPointerOnCanvas = false;

            const sponge = { x: W / 2, y: H / 2, tx: W / 2, ty: W / 2 };

            let mudSpots = [];
            let bubbles = [];
            let sparkles = [];
            let hearts = [];

            // ============ 初始化 ============
            function initMudSpots() {
                mudSpots = [];
                for (let i = 0; i < 14; i++) {
                    mudSpots.push({
                        x: 120 + Math.random() * 160,
                        y: 140 + Math.random() * 230,
                        r: 8 + Math.random() * 15,
                        cleaned: 0,
                        maxClean: 1,
                    });
                }
            }

            function resetGame() {
                progress = 0;
                gameState = 'playing';
                doneTimer = 0;
                shakeAmount = 0;
                spongeSquish = 0;
                isScrubbing = false;
                sponge.x = W / 2;
                sponge.y = H / 2;
                sponge.tx = W / 2;
                sponge.ty = H / 2;
                initMudSpots();
                bubbles = [];
                sparkles = [];
                hearts = [];
            }

            // ============ 工具函数 ============
            function dist(x1, y1, x2, y2) { return Math.hypot(x1 - x2, y1 - y2); }

            function lerp(a, b, t) { return a + (b - a) * t; }

            function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

            function rand(min, max) { return min + Math.random() * (max - min); }

            // ============ roundRect Polyfill ============
            if (!ctx.roundRect) {
                ctx.roundRect = function(x, y, w, h, r) {
                    if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
                    if (!r) r = { tl: 0, tr: 0, br: 0, bl: 0 };
                    ctx.beginPath();
                    ctx.moveTo(x + r.tl, y);
                    ctx.lineTo(x + w - r.tr, y);
                    ctx.quadraticCurveTo(x + w, y, x + w, y + r.tr);
                    ctx.lineTo(x + w, y + h - r.br);
                    ctx.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
                    ctx.lineTo(x + r.bl, y + h);
                    ctx.quadraticCurveTo(x, y + h, x, y + h - r.bl);
                    ctx.lineTo(x, y + r.tl);
                    ctx.quadraticCurveTo(x, y, x + r.tl, y);
                    ctx.closePath();
                };
            }

            // ============ 绘制函数 ============
            function drawBackground() {
                const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
                bgGrad.addColorStop(0, '#f0f4f8');
                bgGrad.addColorStop(0.5, '#fef5f7');
                bgGrad.addColorStop(1, '#fdf6f0');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, W, H);

                ctx.strokeStyle = 'rgba(200,180,175,0.1)';
                ctx.lineWidth = 1;
                for (let x = 50; x < W; x += 50) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, H - 110);
                    ctx.stroke();
                }
                for (let y = 40; y < H - 110; y += 40) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(W, y);
                    ctx.stroke();
                }
            }

            function drawTileFloor() {
                const tileW = 58;
                const tileH = 55;
                const cols = 7;
                const rows = 2;
                const startX = (W - cols * tileW) / 2;
                const startY = H - rows * tileH;

                for (let row = 0; row < rows; row++) {
                    for (let col = 0; col < cols; col++) {
                        const x = startX + col * tileW;
                        const y = startY + row * tileH;
                        const hue = 25 + (row + col) * 4;

                        ctx.fillStyle = `hsl(${hue}, 30%, 87%)`;
                        ctx.beginPath();
                        ctx.roundRect(x + 2, y + 2, tileW - 4, tileH - 4, 8);
                        ctx.fill();

                        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.roundRect(x + 2, y + 2, tileW - 4, tileH - 4, 8);
                        ctx.stroke();

                        ctx.fillStyle = 'rgba(200,170,155,0.2)';
                        ctx.beginPath();
                        ctx.arc(x + tileW / 2, y + tileH / 2, 3.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            function drawPiggy() {
                ctx.save();
const bounce = Math.sin(Date.now()/80) * pigBounce;

ctx.translate(
0,
-bounce
);
                const pigW = 200;
                const pigH = 240;
                const pigX = W / 2 - pigW / 2;
                const pigY = 130;
if (pigLoaded) {
                    ctx.drawImage(pigImg, pigX, pigY, pigW, pigH);
                    // 眨眼

if(pigBlink > 0){

ctx.fillStyle="rgba(40,30,30,0.8)";

ctx.beginPath();

ctx.ellipse(
pigX+65,
pigY+105,
12,
3,
0,
0,
Math.PI*2
);

ctx.fill();


ctx.beginPath();

ctx.ellipse(
pigX+135,
pigY+105,
12,
3,
0,
0,
Math.PI*2
);

ctx.fill();

}

                else {

return;

}
                    ctx.fillStyle = '#ffd2da';
                    ctx.beginPath();
                    ctx.ellipse(W / 2, pigY + pigH / 2, pigW / 2, pigH / 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.font = '14px "PingFang SC", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('🐷 加载中...', W / 2, pigY + pigH / 2 + 5);
                }

                ctx.restore();
            }

            function drawMud() {
                mudSpots.forEach(spot => {
                    if (spot.cleaned >= spot.maxClean) return;
                    const alpha = clamp(1 - spot.cleaned / spot.maxClean, 0, 1);
                    const grad = ctx.createRadialGradient(spot.x, spot.y, spot.r * 0.2, spot.x, spot.y, spot.r);
                    grad.addColorStop(0, `rgba(90,55,35,${alpha * 0.9})`);
                    grad.addColorStop(0.6, `rgba(75,45,28,${alpha * 0.7})`);
                    grad.addColorStop(1, 'rgba(50,30,18,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(spot.x, spot.y, spot.r, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            function drawSponge() {
                if (!isPointerOnCanvas && !isScrubbing) {
                    const alpha = 0.15 + Math.sin(Date.now() / 800) * 0.08;
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.strokeStyle = '#ffb6c1';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    ctx.arc(sponge.x, sponge.y, 24, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.restore();
                    return;
                }

                ctx.save();
                ctx.translate(sponge.x, sponge.y);
                const sq = spongeSquish;

                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                ctx.beginPath();
                ctx.roundRect(-16 + sq * 3, -10 + sq * 2, 32 - sq * 6, 22 + sq * 3, 7);
                ctx.fill();

                const spongeGrad = ctx.createLinearGradient(0, -14, 0, 14 + sq);
                spongeGrad.addColorStop(0, '#ffe680');
                spongeGrad.addColorStop(0.4, '#ffd54f');
                spongeGrad.addColorStop(1, '#f0a830');
                ctx.fillStyle = spongeGrad;
                ctx.beginPath();
                ctx.roundRect(-15 + sq * 3, -11 + sq, 30 - sq * 6, 20 + sq * 2, 6);
                ctx.fill();

                ctx.fillStyle = 'rgba(255,255,255,0.35)';
                ctx.beginPath();
                ctx.roundRect(-10 + sq * 2, -7 + sq, 14 - sq * 4, 6, 3);
                ctx.fill();

                if (isScrubbing && spongeSquish > 0.3) {
                    ctx.fillStyle = 'rgba(180,210,240,0.7)';
                    for (let i = 0; i < 3; i++) {
                        ctx.beginPath();
                        ctx.arc(rand(-12, 12), rand(8, 16), rand(1.5, 3), 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                ctx.restore();
            }

            function drawProgressBar() {
                const bw = 240;
                const bh = 12;
                const bx = (W - bw) / 2;
                const by = 16;

                ctx.fillStyle = 'rgba(0,0,0,0.06)';
                ctx.beginPath();
                ctx.roundRect(bx - 2, by - 2, bw + 4, bh + 4, 10);
                ctx.fill();

                ctx.fillStyle = '#f5e8e0';
                ctx.beginPath();
                ctx.roundRect(bx, by, bw, bh, 8);
                ctx.fill();

                const pw = (progress / 100) * bw;
                if (pw > 0) {
                    const pg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
                    pg.addColorStop(0, '#8dd4ec');
                    pg.addColorStop(0.5, '#5db8d8');
                    pg.addColorStop(1, '#a0ddf2');
                    ctx.fillStyle = pg;
                    ctx.beginPath();
                    ctx.roundRect(bx, by, pw, bh, 8);
                    ctx.fill();
                }

                ctx.fillStyle = '#5a4030';
                ctx.font = 'bold 10px "PingFang SC", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('干净 ' + Math.round(progress) + '%', W / 2, by + 10);
            }

            function drawCompletionUI() {
                if (gameState !== 'done') return;

                const pulse = Math.sin(Date.now() / 500) * 0.06 + 0.44;
                const overlayAlpha = clamp(doneTimer / 1.5, 0, pulse);
                ctx.fillStyle = `rgba(255,250,245,${overlayAlpha})`;
                ctx.fillRect(0, 0, W, H);

                if (doneTimer > 0.8) {
                    const textAlpha = clamp((doneTimer - 0.8) / 0.5, 0, 1);
                    const rotation = Date.now() / 1200;
                    ctx.save();
                    ctx.globalAlpha = textAlpha;
                    ctx.translate(W / 2, H / 2 - 28);
                    ctx.rotate(Math.sin(rotation) * 0.04);
                    ctx.fillStyle = 'rgba(210,100,120,1)';
                    ctx.font = 'bold 26px "PingFang SC", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('✨ 香香小猪 ✨', 0, 0);
                    ctx.restore();
                }

                if (doneTimer > 1.5) {
                    const btnAlpha = clamp((doneTimer - 1.5) / 0.4, 0, 1);
                    const btnX = W / 2 - 55;
                    const btnY = H / 2 + 6;
                    const btnW = 110;
                    const btnH = 38;

                    ctx.globalAlpha = btnAlpha;
                    ctx.fillStyle = 'rgba(255,255,255,0.9)';
                    ctx.strokeStyle = 'rgba(220,140,150,1)';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.roundRect(btnX, btnY, btnW, btnH, 19);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = 'rgba(200,90,110,1)';
                    ctx.font = 'bold 16px "PingFang SC", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('🔄 再洗一次', W / 2, btnY + 26);
                    ctx.globalAlpha = 1;
                }
            }

            // ============ 粒子 ============
            function spawnBubble(x, y) {
                bubbles.push({
                    x: x + rand(-10, 10),
                    y: y + rand(-8, 8),
                    r: 4 + Math.random() * 10,
                    speed: 0.5 + Math.random() * 1.5,
                    life: 1,
                });
            }

            function spawnHeart(x, y) {
                hearts.push({
                    x,
                    y,
                    vx: rand(-1.5, 1.5),
                    vy: -2 - Math.random() * 3,
                    life: 1,
                    decay: 0.01 + Math.random() * 0.02,
                    size: 10 + Math.random() * 10,
                });
            }

            // ============ 游戏逻辑 ============
            function update(dt) {
                sponge.x = lerp(sponge.x, sponge.tx, 1 - Math.exp(-28 * dt));
                sponge.y = lerp(sponge.y, sponge.ty, 1 - Math.exp(-28 * dt));
                if (!isScrubbing) spongeSquish = lerp(spongeSquish, 0, 1 - Math.exp(-12 * dt));

                if (isScrubbing && gameState === 'playing') {
                    spongeSquish = lerp(spongeSquish, 1, 1 - Math.exp(-20 * dt));
                    let anyCleaned = false;
                    mudSpots.forEach(spot => {
                        if (spot.cleaned >= spot.maxClean) return;
                        const d = dist(sponge.x, sponge.y, spot.x, spot.y);
                        const overlap = 26 + spot.r - d;
                        if (overlap > 0) {
                            const eff = clamp(overlap / (spot.r + 26), 0.2, 1);
                            spot.cleaned += eff * dt * 0.72;
                            if (spot.cleaned > spot.maxClean) spot.cleaned = spot.maxClean;
                            anyCleaned = true;
                            if (Math.random() < dt * 18 * eff) spawnBubble(spot.x, spot.y);
                        }
                    });
                    if (anyCleaned) shakeAmount = lerp(shakeAmount, 1.2, 1 - Math.exp(-18 * dt));
                }
                shakeAmount = lerp(shakeAmount, 0, 1 - Math.exp(-10 * dt));
                if (shakeAmount < 0.03) shakeAmount = 0;

                if (gameState === 'playing') {
                    const total = mudSpots.reduce((a, s) => a + clamp(s.cleaned / s.maxClean, 0, 1), 0);
                    progress = (total / mudSpots.length) * 100;
                    if (progress >= 99.5) {
                        progress = 100;
                        gameState = 'done';
                        doneTimer = 0;
                        mudSpots.forEach(s => (s.cleaned = s.maxClean));
                    }
                }

                if (gameState === 'done') {
                    doneTimer += dt;
                    if (Math.random() < dt * 5 && doneTimer < 4) {
                        sparkles.push({
                            x: 120 + Math.random() * 160,
                            y: 140 + Math.random() * 200,
                            life: 1,
                            r: 3 + Math.random() * 6,
                        });
                    }
                }
// 弹跳恢复

if(pigBounce>0){

pigBounce -= dt*8;

}

if(pigBounce<0){

pigBounce=0;

}


// 自动眨眼

blinkTimer += dt;

if(blinkTimer>4){

pigBlink=0.18;

blinkTimer=0;

}

if(pigBlink>0){

pigBlink-=dt;

}

                // 更新粒子
                for (let i = bubbles.length - 1; i >= 0; i--) {
                    bubbles[i].y -= bubbles[i].speed;
                    bubbles[i].life -= dt * 0.4;
                    if (bubbles[i].life <= 0 || bubbles[i].y < -30) bubbles.splice(i, 1);
                }
                for (let i = sparkles.length - 1; i >= 0; i--) {
                    sparkles[i].life -= dt * 0.8;
                    sparkles[i].y -= dt * 30;
                    if (sparkles[i].life <= 0) sparkles.splice(i, 1);
                }
                for (let i = hearts.length - 1; i >= 0; i--) {
                    hearts[i].x += hearts[i].vx;
                    hearts[i].y += hearts[i].vy;
                    hearts[i].vy += 0.08;
                    hearts[i].life -= hearts[i].decay;
                    if (hearts[i].life <= 0) hearts.splice(i, 1);
                }
            }

            function render() {
                ctx.clearRect(0, 0, W, H);
                drawBackground();
                drawTileFloor();
                drawPiggy();
                if (gameState === 'playing' || (gameState === 'done' && doneTimer < 1)) drawMud();

                bubbles.forEach(b => {
                    ctx.save();
                    ctx.globalAlpha = b.life * 0.7;
                    ctx.fillStyle = 'rgba(200,230,255,0.6)';
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.beginPath();
                    ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });
                sparkles.forEach(s => {
                    ctx.fillStyle = `rgba(255,220,100,${s.life})`;
                    ctx.font = `${s.r * 3}px sans-serif`;
                    ctx.fillText('✨', s.x - s.r, s.y);
                });
                hearts.forEach(h => {
                    ctx.save();
                    ctx.globalAlpha = h.life;
                    ctx.fillStyle = '#ff6b8a';
                    ctx.font = `${h.size}px sans-serif`;
                    ctx.fillText('❤️', h.x - h.size / 2, h.y + h.size / 2);
                    ctx.restore();
                });

                drawSponge();
                drawProgressBar();
                drawCompletionUI();
            }

            function gameLoop(timestamp) {
                if (!gameLoop.lastTime) gameLoop.lastTime = timestamp;
                let dt = (timestamp - gameLoop.lastTime) / 1000;
                if (dt > 0.15) dt = 0.15;
                gameLoop.lastTime = timestamp;
                update(dt);
                render();
                requestAnimationFrame(gameLoop);
            }
            gameLoop.lastTime = 0;

            // ============ 事件处理 ============
            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                const cy = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (cx - rect.left) * (W / rect.width),
                    y: (cy - rect.top) * (H / rect.height),
                };
            }

            function handleDown(p) {
                // 点击小猪

if(
p.x>100 &&
p.x<300 &&
p.y>120 &&
p.y<380
){

pigBounce=8;

pigBlink=0.2;

spawnHeart(
p.x,
p.y-50
);

}

                sponge.tx = p.x;
                sponge.ty = p.y;
                sponge.x = p.x;
                sponge.y = p.y;
                isScrubbing = true;
                isPointerOnCanvas = true;

                if (gameState === 'done') {
                    if (p.x > 110 && p.x < 290 && p.y > 130 && p.y < 370) {
                        for (let i = 0; i < 6; i++) spawnHeart(p.x, p.y);
                    }
                    if (doneTimer > 1.5) {
                        const bx = W / 2 - 55,
                            by = H / 2 + 6,
                            bw = 110,
                            bh = 38;
                        if (p.x > bx && p.x < bx + bw && p.y > by && p.y < by + bh) {
                            resetGame();
                            return;
                        }
                    }
                }
            }

            canvas.addEventListener('mousedown', e => { e.preventDefault();
                handleDown(getPos(e)); });
            canvas.addEventListener('mousemove', e => { e.preventDefault();
                const p = getPos(e);
                sponge.tx = p.x;
                sponge.ty = p.y;
                isPointerOnCanvas = true; });
            canvas.addEventListener('mouseup', e => { e.preventDefault();
                isScrubbing = false;
                spongeSquish = 0; });
            canvas.addEventListener('mouseleave', () => { isPointerOnCanvas = false;
                isScrubbing = false;
                spongeSquish = 0; });
            canvas.addEventListener('touchstart', e => { e.preventDefault();
                handleDown(getPos(e)); }, { passive: false });
            canvas.addEventListener('touchmove', e => { e.preventDefault();
                const p = getPos(e);
                sponge.tx = p.x;
                sponge.ty = p.y;
                isPointerOnCanvas = true; }, { passive: false });
            canvas.addEventListener('touchend', e => { e.preventDefault();
                isScrubbing = false;
                spongeSquish = 0; });
            canvas.addEventListener('touchcancel', e => { e.preventDefault();
                isScrubbing = false;
                spongeSquish = 0;
                isPointerOnCanvas = false; });

            document.addEventListener('mouseup', () => { if (isScrubbing) { isScrubbing = false;
                    spongeSquish = 0; } });

            // ============ 启动 ============
            resetGame();
            requestAnimationFrame(gameLoop);
        })();
    </script>
</body>
</html>
