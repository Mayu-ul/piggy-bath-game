<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,user-scalable=no">
<title>🐷 给小猪洗澡</title>

<style>
:root{
    --pink:#d4687c;
    --shadow:rgba(180,140,150,.25);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
        180deg,
        #e8f4f8,
        #fce4ec,
        #fff8e1
    );
    font-family:
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
    padding:12px;
    user-select:none;
}

.game-wrapper{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
}

.title{
    font-size:24px;
    font-weight:bold;
    color:var(--pink);
    animation:titleFloat 3s infinite;
}

@keyframes titleFloat{
    50%{
        transform:translateY(-5px);
    }
}

.canvas-container{
    width:100%;
    aspect-ratio:400/520;
    background:white;
    border-radius:28px;
    overflow:hidden;

    box-shadow:
    0 20px 40px var(--shadow),
    0 5px 15px rgba(0,0,0,.08);
}

canvas{
    width:100%;
    height:100%;
    display:block;
    cursor:none;
    touch-action:none;
}

.hint{
    background:rgba(255,255,255,.7);
    padding:8px 15px;
    border-radius:20px;
    color:#b08a7a;
    font-size:13px;
}

</style>

</head>

<body>

<div class="game-wrapper">

<div class="title">
🐷 给小猪洗澡 🫧
</div>


<div class="canvas-container">
<canvas id="c"
width="400"
height="520"></canvas>
</div>


<div class="hint">
✨ 按住擦洗泥巴 · 洗完点击小猪弹爱心 ✨
</div>

</div>



<script>

(function(){

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");


const W=400;
const H=520;



/*
================================
加载你的 SVG 小猪
================================
*/

const pigImg=new Image();


// 使用你提供的小猪图片
pigImg.src="pig.svg?123";


let pigLoaded=false;


pigImg.onload=function(){

    pigLoaded=true;

    console.log("猪加载成功");

    render();

};


pigImg.onerror=function(){

    console.log("猪加载失败");

};



/*
================================
游戏状态
================================
*/


let progress=0;

let gameState="playing";

let doneTimer=0;

let shakeAmount=0;

let spongeSquish=0;

let isScrubbing=false;

let isPointerOnCanvas=false;



const sponge={
x:200,
y:260,
tx:200,
ty:260
};



let mudSpots=[];

let bubbles=[];

let sparkles=[];

let hearts=[];



/*
================================
初始化泥巴
================================
*/


function initMudSpots(){

mudSpots=[];


const area={
x:120,
y:150,
w:160,
h:220
};


for(let i=0;i<14;i++){

mudSpots.push({

x:area.x+
Math.random()*area.w,

y:area.y+
Math.random()*area.h,

r:8+
Math.random()*15,

cleaned:0,

maxClean:1

});

}

}




function resetGame(){

progress=0;

gameState="playing";

doneTimer=0;

shakeAmount=0;

spongeSquish=0;


sponge.x=200;

sponge.y=260;

sponge.tx=200;

sponge.ty=260;


initMudSpots();


bubbles=[];

sparkles=[];

hearts=[];

}



/*
================================
工具函数
================================
*/


function lerp(a,b,t){

return a+(b-a)*t;

}



function clamp(v,min,max){

return Math.max(min,Math.min(max,v));

}



function rand(a,b){

return a+Math.random()*(b-a);

}



function dist(x1,y1,x2,y2){

return Math.hypot(
x1-x2,
y1-y2
);

}
/*
================================
绘制背景
================================
*/

function drawBackground(){

const g=ctx.createLinearGradient(
0,0,0,H
);

g.addColorStop(
0,
"#f0f4f8"
);

g.addColorStop(
0.5,
"#fef5f7"
);

g.addColorStop(
1,
"#fdf6f0"
);


ctx.fillStyle=g;

ctx.fillRect(
0,
0,
W,
H
);



/* 网格 */

ctx.strokeStyle=
"rgba(200,180,175,.12)";

ctx.lineWidth=1;


for(let x=40;x<W;x+=40){

ctx.beginPath();

ctx.moveTo(x,0);

ctx.lineTo(x,H-100);

ctx.stroke();

}


for(let y=40;y<H-100;y+=40){

ctx.beginPath();

ctx.moveTo(0,y);

ctx.lineTo(W,y);

ctx.stroke();

}


}





/*
================================
地砖
================================
*/


function drawTileFloor(){

const tw=58;

const th=55;

const rows=2;

const cols=7;


const sx=
(W-cols*tw)/2;


const sy=
H-rows*th;



for(let r=0;r<rows;r++){

for(let c=0;c<cols;c++){


let x=sx+c*tw;

let y=sy+r*th;



ctx.fillStyle=
"#eee3d8";


ctx.beginPath();

ctx.roundRect(
x+3,
y+3,
tw-6,
th-6,
8
);

ctx.fill();



ctx.strokeStyle=
"rgba(255,255,255,.7)";

ctx.lineWidth=2;


ctx.beginPath();

ctx.roundRect(
x+3,
y+3,
tw-6,
th-6,
8
);

ctx.stroke();



}

}

}



/*
================================
绘制小猪
================================
*/


function drawPiggy(){

ctx.save();



let sx=
shakeAmount*
(Math.random()-.5)
*2;


let sy=
shakeAmount*
(Math.random()-.5)
*2;



ctx.translate(
sx,
sy
);



const pigW=200;

const pigH=240;

const pigX=
W/2-pigW/2;

const pigY=130;



if(
pigLoaded
){

ctx.drawImage(
    pigImg,
    pigX,
    pigY,
    200,
    240
);


}else{


ctx.fillStyle="#ffd2da";

ctx.beginPath();

ctx.ellipse(
W/2,
250,
90,
120,
0,
0,
Math.PI*2
);

ctx.fill();


ctx.fillStyle="#8a6870";

ctx.font=
"14px sans-serif";

ctx.textAlign="center";

ctx.fillText(
"小猪加载中...",
W/2,
255
);


}



ctx.restore();


}





/*
================================
泥巴
================================
*/


function drawMud(){


mudSpots.forEach(
spot=>{


if(
spot.cleaned>=1
)return;



let alpha=
clamp(
1-spot.cleaned,
0,
1
);



let g=
ctx.createRadialGradient(

spot.x,
spot.y,
2,

spot.x,
spot.y,
spot.r

);



g.addColorStop(
0,
`rgba(90,55,35,${alpha})`
);


g.addColorStop(
0.7,
`rgba(70,40,25,${alpha*.7})`
);


g.addColorStop(
1,
"rgba(50,30,20,0)"
);



ctx.fillStyle=g;


ctx.beginPath();

ctx.arc(
spot.x,
spot.y,
spot.r,
0,
Math.PI*2
);


ctx.fill();



});

}




/*
================================
海绵
================================
*/


function drawSponge(){


if(
!isPointerOnCanvas &&
!isScrubbing
){

ctx.save();

ctx.globalAlpha=.25;

ctx.strokeStyle="#ffb6c1";

ctx.setLineDash(
[5,5]
);


ctx.beginPath();

ctx.arc(
sponge.x,
sponge.y,
24,
0,
Math.PI*2
);


ctx.stroke();

ctx.restore();

return;

}



ctx.save();



ctx.translate(
sponge.x,
sponge.y
);



let sq=
spongeSquish;



ctx.fillStyle=
"rgba(0,0,0,.1)";


ctx.beginPath();


ctx.roundRect(
-16+sq*3,
-10+sq*2,
32-sq*6,
22+sq*3,
7
);


ctx.fill();



let g=
ctx.createLinearGradient(
0,-15,
0,15
);


g.addColorStop(
0,
"#ffe680"
);

g.addColorStop(
1,
"#f0a830"
);


ctx.fillStyle=g;



ctx.beginPath();

ctx.roundRect(
-15+sq*3,
-11+sq,
30-sq*6,
20+sq*2,
6
);


ctx.fill();



ctx.restore();


}



/*
================================
进度条
================================
*/


function drawProgressBar(){


let bw=240;

let bh=12;

let bx=(W-bw)/2;

let by=16;



ctx.fillStyle=
"rgba(0,0,0,.08)";


ctx.beginPath();

ctx.roundRect(
bx-2,
by-2,
bw+4,
bh+4,
10
);

ctx.fill();



ctx.fillStyle=
"#f5e8e0";


ctx.beginPath();

ctx.roundRect(
bx,
by,
bw,
bh,
8
);

ctx.fill();



let pw=
progress/100*bw;



ctx.fillStyle=
"#72c8e8";


ctx.beginPath();

ctx.roundRect(
bx,
by,
pw,
bh,
8
);

ctx.fill();



ctx.fillStyle="#5a4030";

ctx.font=
"bold 10px sans-serif";

ctx.textAlign="center";


ctx.fillText(

"干净 "+Math.round(progress)+"%",

W/2,

by+10

);



}
/*
================================
粒子效果
================================
*/


function spawnBubble(x,y){

bubbles.push({

x:x+rand(-10,10),

y:y+rand(-8,8),

r:4+Math.random()*10,

speed:.5+Math.random()*1.5,

life:1

});

}



function spawnHeart(x,y){

hearts.push({

x:x,

y:y,

vx:rand(-1.5,1.5),

vy:-2-Math.random()*3,

life:1,

decay:.015,

size:12+Math.random()*10

});

}




/*
================================
完成效果
================================
*/


function drawCompletionUI(){


if(gameState!=="done")
return;



ctx.fillStyle=
"rgba(255,250,245,.45)";


ctx.fillRect(
0,
0,
W,
H
);



ctx.fillStyle=
"#d26478";


ctx.font=
"bold 28px sans-serif";

ctx.textAlign="center";


ctx.fillText(
"✨ 香香小猪 ✨",
W/2,
240
);



ctx.fillStyle=
"white";


ctx.strokeStyle=
"#dc8c96";


ctx.lineWidth=2;



ctx.beginPath();

ctx.roundRect(
145,
260,
110,
40,
20
);


ctx.fill();

ctx.stroke();



ctx.fillStyle=
"#c85a70";

ctx.font=
"bold 16px sans-serif";


ctx.fillText(
"🔄 再洗一次",
200,
286
);



}




/*
================================
更新逻辑
================================
*/


function update(dt){


/* 海绵跟随 */

sponge.x=
lerp(
sponge.x,
sponge.tx,
1-Math.exp(-28*dt)
);


sponge.y=
lerp(
sponge.y,
sponge.ty,
1-Math.exp(-28*dt)
);



if(!isScrubbing){

spongeSquish=
lerp(
spongeSquish,
0,
1-Math.exp(-12*dt)
);

}



/* 擦洗 */

if(
isScrubbing &&
gameState==="playing"
){


spongeSquish=
lerp(
spongeSquish,
1,
1-Math.exp(-20*dt)
);



let cleaned=false;



mudSpots.forEach(
spot=>{


if(
spot.cleaned>=1
)
return;



let d=
dist(
sponge.x,
sponge.y,
spot.x,
spot.y
);



let overlap=
26+spot.r-d;



if(overlap>0){


let power=
clamp(
overlap/(spot.r+26),
.2,
1
);



spot.cleaned+=
power*
dt*
.75;



if(
spot.cleaned>1
)
spot.cleaned=1;



cleaned=true;



if(
Math.random()<dt*15
){

spawnBubble(
spot.x,
spot.y
);

}



}



});



if(cleaned){

shakeAmount=
lerp(
shakeAmount,
1.2,
1-Math.exp(-18*dt)
);

}


}



/* 震动恢复 */

shakeAmount=
lerp(
shakeAmount,
0,
1-Math.exp(-10*dt)
);



/* 计算进度 */

if(gameState==="playing"){


let total=0;


mudSpots.forEach(
s=>{

total+=clamp(
s.cleaned,
0,
1
);

});


progress=
total/mudSpots.length*100;



if(progress>=99.5){


progress=100;

gameState="done";

doneTimer=0;


mudSpots.forEach(
s=>s.cleaned=1
);


}



}



/* 完成计时 */

if(gameState==="done"){


doneTimer+=dt;



if(
Math.random()<dt*5
){

sparkles.push({

x:120+Math.random()*160,

y:150+Math.random()*180,

life:1,

r:3+Math.random()*5

});

}


}




/* 泡泡 */

for(
let i=bubbles.length-1;
i>=0;
i--
){

let b=bubbles[i];


b.y-=b.speed;

b.life-=dt*.5;


if(
b.life<=0
){

bubbles.splice(i,1);

}

}



/* 星星 */

for(
let i=sparkles.length-1;
i>=0;
i--
){

let s=sparkles[i];

s.y-=dt*30;

s.life-=dt;



if(s.life<=0){

sparkles.splice(i,1);

}

}




/* 爱心 */

for(
let i=hearts.length-1;
i>=0;
i--
){

let h=hearts[i];


h.x+=h.vx;

h.y+=h.vy;

h.vy+=.08;


h.life-=h.decay;


if(h.life<=0){

hearts.splice(i,1);

}


}



}




/*
================================
渲染
================================
*/


function render(){


ctx.clearRect(
0,
0,
W,
H
);



drawBackground();

drawTileFloor();

drawPiggy();



if(
gameState==="playing"
){

drawMud();

}




/* 泡泡 */

bubbles.forEach(
b=>{

ctx.globalAlpha=b.life*.7;

ctx.fillStyle=
"rgba(200,230,255,.8)";


ctx.beginPath();

ctx.arc(
b.x,
b.y,
b.r,
0,
Math.PI*2
);


ctx.fill();


ctx.globalAlpha=1;

});



/* 星星 */

sparkles.forEach(
s=>{


ctx.globalAlpha=s.life;

ctx.font=
"20px sans-serif";


ctx.fillText(
"✨",
s.x,
s.y
);



ctx.globalAlpha=1;


});



/* 爱心 */

hearts.forEach(
h=>{


ctx.globalAlpha=h.life;


ctx.font=
h.size+"px sans-serif";


ctx.fillText(
"❤️",
h.x,
h.y
);


ctx.globalAlpha=1;


});



drawSponge();

drawProgressBar();

drawCompletionUI();



}



function gameLoop(t){


if(!gameLoop.last)
gameLoop.last=t;


let dt=
(t-gameLoop.last)/1000;


gameLoop.last=t;



if(dt>.15)
dt=.15;



update(dt);

render();


requestAnimationFrame(gameLoop);


}
// =================================
// 事件处理
// =================================


function getPos(e){

const rect=
canvas.getBoundingClientRect();


const x=
e.touches
?
e.touches[0].clientX
:
e.clientX;


const y=
e.touches
?
e.touches[0].clientY
:
e.clientY;



return {

x:(x-rect.left)
*(W/rect.width),

y:(y-rect.top)
*(H/rect.height)

};


}




function handleDown(p){


sponge.tx=p.x;

sponge.ty=p.y;

sponge.x=p.x;

sponge.y=p.y;


isScrubbing=true;

isPointerOnCanvas=true;



/*
完成后点击小猪
*/

if(
gameState==="done"
){


if(
p.x>100 &&
p.x<300 &&
p.y>120 &&
p.y<380
){


for(
let i=0;i<6;i++
){

spawnHeart(
p.x,
p.y
);

}


}




/*
重新开始按钮
*/

if(
p.x>140 &&
p.x<260 &&
p.y>250 &&
p.y<310
){

resetGame();

}


}


}




// 鼠标

canvas.addEventListener(

"mousedown",

e=>{

e.preventDefault();

handleDown(
getPos(e)
);

}

);



canvas.addEventListener(

"mousemove",

e=>{


e.preventDefault();


let p=getPos(e);


sponge.tx=p.x;

sponge.ty=p.y;


isPointerOnCanvas=true;


}

);



canvas.addEventListener(

"mouseup",

()=>{


isScrubbing=false;

spongeSquish=0;


}

);



canvas.addEventListener(

"mouseleave",

()=>{


isPointerOnCanvas=false;

isScrubbing=false;

spongeSquish=0;


}

);




// 手机触摸


canvas.addEventListener(

"touchstart",

e=>{


e.preventDefault();


handleDown(
getPos(e)
);


},

{
passive:false
}

);



canvas.addEventListener(

"touchmove",

e=>{


e.preventDefault();


let p=getPos(e);


sponge.tx=p.x;

sponge.ty=p.y;


isPointerOnCanvas=true;



},

{
passive:false
}

);



canvas.addEventListener(

"touchend",

e=>{


e.preventDefault();


isScrubbing=false;

spongeSquish=0;


},

{
passive:false
}

);






document.addEventListener(

"mouseup",

()=>{


if(isScrubbing){

isScrubbing=false;

spongeSquish=0;

}


}

);






// =================================
// 启动游戏
// =================================


resetGame();


requestAnimationFrame(
gameLoop
);



})();

</script>


</body>

</html>
